name: Deploy Pro Max TV Web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le dossier Web
        run: flutter create --platforms=web --org com.promaxtv --project-name promax_tv .
      - name: Titre et support HLS
        run: |
          sed -i 's|<title>[^<]*</title>|<title>Pro Max TV</title>|' web/index.html
          sed -i 's|</head>|  <script src="assets/packages/media_kit/assets/web/hls1.4.10.js"></script>\n</head>|' web/index.html
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4

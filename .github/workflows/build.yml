name: Build TV Max Pro APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le dossier Android
        run: flutter create --platforms=android --org com.tvmaxpro --project-name tvmax_pro .
      - name: Préparer et convertir la bannière et l'icône
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p assets android/app/src/main/res/drawable
          
          # Cherche banner n'importe où dans le projet
          BANNER_SRC=$(find . -maxdepth 3 -type f \( -iname "*banner*.png" -o -iname "*banner*.jpg" -o -iname "*banner*.jpeg" -o -iname "*banner*.webp" -o -iname "*banner*.svg" \) | head -n 1)

          if [ -n "$BANNER_SRC" ]; then
            convert "$BANNER_SRC" -resize 640x360! PNG32:assets/banner.png
          else
            convert -size 640x360 xc:#050A0E PNG32:assets/banner.png
          fi
          convert assets/banner.png -resize 320x180! PNG32:android/app/src/main/res/drawable/banner.png
          
          # Cherche icon n'importe où dans le projet
                  ICON_SRC=$(find . -maxdepth 3 -type f \( -iname "*icon*.png" -o -iname "*icon*.jpg" -o -iname "*icon*.jpeg" -o -iname "*icon*.webp" -o -iname "*icon*.svg" \) | head -n 1)

          if [ -n "$ICON_SRC" ]; then
            convert "$ICON_SRC" -resize 512x512! PNG32:assets/icon.png
          else
            convert -size 512x512 xc:#050A0E PNG32:assets/icon.png
          fi
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            convert assets/icon.png -resize 192x192! PNG32:android/app/src/main/res/$dir/ic_launcher.png
          done
      - name: Nom, Internet, HTTP en clair, Google TV et Désactivation Impeller
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="TV Max Pro"|' $M
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <application android:usesCleartextTraffic="true" android:banner="@drawable/banner"|' $M
          sed -i 's|<category android:name="android.intent.category.LAUNCHER"/>|&\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>|' $M
          sed -i 's|</application>|    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n    </application>|' $M
      - run: flutter pub get
      - name: Build APK léger (un fichier par architecture)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: tvmax-pro-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

name: Build Pro Max TV APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le dossier Android
        run: flutter create --platforms=android --org com.promaxtv --project-name promax_tv .
      - name: Nom, Internet, HTTP en clair, Google TV
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Pro Max TV"|' $M
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <uses-feature android:name="android.software.leanback" android:required="false"/>\n    <application android:usesCleartextTraffic="true"|' $M
          sed -i 's|<category android:name="android.intent.category.LAUNCHER"/>|&\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>|' $M
      - run: flutter pub get
      - name: Build APK léger (un fichier par architecture)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: promax-tv-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
